<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:,">
    <title>Oyu Tolgoi — Operations Console</title>

    <!-- Fonts & icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/duotone/style.css">

    <!-- MapLibre GL JS v5 (UMD — no build step) -->
    <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

    <link rel="stylesheet" href="css/main.css?v=20260702">
</head>
<body>
    <div id="app">
        <!-- KPI band -->
        <header id="kpi-band">
            <div class="brand">
                <span class="brand-name">OT OPS</span>
                <span class="brand-site">Oyu Tolgoi · Ömnögovi, MN</span>
            </div>
            <div class="kpi kpi-placeholder">
                <span class="kpi-label">Throughput</span>
                <span class="kpi-value">—<span class="unit">t/h</span></span>
            </div>
            <div class="kpi kpi-placeholder">
                <span class="kpi-label">Fleet operating</span>
                <span class="kpi-value">—</span>
            </div>
            <div class="kpi kpi-placeholder">
                <span class="kpi-label">Utilisation</span>
                <span class="kpi-value">—<span class="unit">%</span></span>
            </div>
            <div class="kpi kpi-placeholder">
                <span class="kpi-label">Active alerts</span>
                <span class="kpi-value">—</span>
            </div>
            <span id="site-clock">--:--:-- ULN</span>
        </header>

        <!-- Asset rail -->
        <nav id="asset-rail">
            <div class="rail-title">Site assets</div>
            <div id="asset-list"></div>
        </nav>

        <!-- Map canvas -->
        <main id="map-container">
            <div id="map"></div>
            <div class="map-toolbar">
                <button id="btn-terrain" class="map-btn">
                    <i class="ph-duotone ph-mountains"></i>3D terrain
                </button>
                <button id="btn-reset" class="map-btn">
                    <i class="ph-duotone ph-crosshair-simple"></i>Reset view
                </button>
            </div>
            <aside id="detail-panel"></aside>
        </main>

        <!-- Event feed -->
        <aside id="event-feed">
            <div class="rail-title">Events</div>
            <div class="feed-empty">
                <i class="ph-duotone ph-pulse"></i>
                <span>Awaiting event stream</span>
            </div>
        </aside>

        <!-- Timeline -->
        <footer id="timeline">
            <span>DAY SHIFT 07:00–19:00</span>
            <div class="shift-bar"><div class="shift-progress"></div></div>
            <span>SIM · not connected</span>
        </footer>
    </div>

    <script type="module" src="js/main.js?v=20260702"></script>
</body>
</html>
